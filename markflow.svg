<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 背景柔和暖色渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8f3" />
      <stop offset="100%" stop-color="#fdfbf7" />
    </linearGradient>
    <!-- 封面渐变 -->
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4d6cc" />
      <stop offset="100%" stop-color="#d48383" />
    </linearGradient>
    <!-- 柔和投影 -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#d2b9a0" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- 圆角底框（手帐空间卡片意象） -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" stroke="#ecd5cc" stroke-width="12" filter="url(#softShadow)" />

  <!-- 翻开的手帐/书签本主体 -->
  <!-- 左页 -->
  <path d="M 120 150 C 180 140, 230 160, 256 190 L 256 380 C 230 350, 180 330, 120 340 Z" fill="#ffffff" stroke="#ecd5cc" stroke-width="8" stroke-linejoin="round" />
  <!-- 右页 -->
  <path d="M 392 150 C 332 140, 282 160, 256 190 L 256 380 C 282 350, 332 330, 392 340 Z" fill="#ffffff" stroke="#ecd5cc" stroke-width="8" stroke-linejoin="round" />

  <!-- 中缝装订线 -->
  <line x1="256" y1="190" x2="256" y2="380" stroke="#ecd5cc" stroke-width="8" stroke-linecap="round" />

  <!-- 页面上的流动线条 (MarkFlow 流动感) -->
  <path d="M 170 230 Q 210 200, 256 240 T 342 220" fill="none" stroke="url(#bookGrad)" stroke-width="12" stroke-linecap="round" />
  <path d="M 170 270 Q 210 240, 256 280 T 342 260" fill="none" stroke="#ecd5cc" stroke-width="8" stroke-linecap="round" />

  <!-- 标志性手帐爱心装饰：已整体下移至右上方安全区域内，绝不超出外圆角 -->
  <path d="M 360 120 C 345 105, 320 105, 305 120 C 290 135, 290 160, 305 175 L 360 230 L 415 175 C 430 160, 430 135, 415 120 C 400 105, 375 105, 360 120 Z" fill="#d48383" transform="translate(-15, 25) scale(0.42)" />
</svg>
