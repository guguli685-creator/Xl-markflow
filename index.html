<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>MarkFlow - 沉浸手帐空间</title>
    <link rel="icon" type="image/svg+xml" href="markflow.svg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #ecd5cc; border-radius: 10px; transition: background 0.2s; }
        ::-webkit-scrollbar-thumb:hover { background: #d48383; }

        html, body { width: 100vw; height: 100vh; position: relative; overflow-x: hidden; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #fdfbf7;
            color: #5c4b43;
            display: flex;
            background-image: radial-gradient(#f1e1d6 1.5px, transparent 1.5px);
            background-size: 28px 28px;
        }

        .mobile-header {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 56px;
            background: linear-gradient(to bottom, rgba(255, 248, 243, 0.95), rgba(255, 248, 243, 0.75));
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-bottom: 2px dashed #f2dfd6; z-index: 120; padding: 0 12px;
            align-items: center; justify-content: space-between;
        }
        .mobile-header h2 { font-size: 16px; color: #d48383; font-weight: 700; flex-shrink: 0; }
        .mobile-header-actions { display: flex; align-items: center; gap: 8px; }

        .header-action-btn {
            border: 2px solid #ecd5cc; width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600;
            cursor: pointer; transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), background-color 0.2s;
            box-shadow: 0 4px 10px rgba(212, 131, 131, 0.1); flex-shrink: 0;
        }
        .sync-btn-header { background: #fff; color: #b56565; }
        .add-card-btn-header { background: #f0ded6; color: #8c4343; }
        .add-btn-header { background: #f4d6cc; color: #a34848; font-size: 18px; font-weight: bold; }
        .layout-btn-header { background: #fffbf8; color: #b56565; }
        .layout-btn-header svg { display: block; stroke: currentColor; pointer-events: none; }
        .mobile-menu-toggle { background: #f4d6cc; color: #a34848; font-size: 16px; border: 2px solid #ecd5cc; }
        .header-action-btn:hover, .mobile-menu-toggle:hover { background: #e2ab9d; color: #fff; transform: scale(1.05); }

        .sidebar {
            width: 260px; background: linear-gradient(135deg, rgba(255, 248, 243, 0.95), rgba(253, 245, 238, 0.85));
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); display: flex; flex-direction: column;
            padding: 24px 16px; z-index: 130; transition: width 0.3s ease, padding 0.3s ease, transform 0.3s ease;
            position: relative; box-shadow: 4px 0 20px rgba(210, 185, 170, 0.08); flex-shrink: 0;
            border-right: 2px dashed #f2dfd6; overflow-y: auto;
        }
        .sidebar.collapsed { width: 76px; padding: 24px 10px; }
        .sidebar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; padding-left: 4px; }
        .sidebar.collapsed .sidebar-header { justify-content: center; padding-left: 0; }
        
        .toggle-btn {
            background: #f4d6cc; border: none; color: #a34848; width: 28px; height: 28px; border-radius: 50%;
            cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center;
            transition: background 0.2s, transform 0.3s; flex-shrink: 0; box-shadow: 0 2px 5px rgba(212, 131, 131, 0.2);
        }
        .toggle-btn:hover { background: #e2ab9d; color: #fff; transform: scale(1.1); }
        .sidebar.collapsed .toggle-btn { margin: 0 auto; }

        .sidebar-bottom-actions { margin-top: auto; padding-top: 12px; display: flex; flex-direction: column; gap: 6px; }
        .sidebar-action-btn {
            background: #fffbf8; border: 1.5px solid #ecd5cc; color: #8c7368; padding: 8px 12px;
            border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex;
            align-items: center; gap: 8px; transition: all 0.2s;
        }
        .sidebar-action-btn:hover { background: #faede6; color: #b56565; border-color: #d48383; }
        .sidebar-action-btn.sync-primary { background: #f4d6cc; color: #a34848; border-color: #d48383; }
        .sidebar-action-btn.sync-primary:hover { background: #e2ab9d; color: #fff; }

        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; width: 100%; }
        .header {
            padding: 20px 36px; display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(to bottom, rgba(253, 251, 247, 0.85), rgba(253, 251, 247, 0.5));
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); position: relative; z-index: 50; gap: 16px;
        }
        .search-box {
            background: #fff; border: 2px solid #ecd5cc; padding: 10px 20px; border-radius: 20px; color: #5c4b43;
            width: 100%; max-width: 460px; outline: none; font-size: 14px; cursor: pointer; margin: 0 auto;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); transition: all 0.25s;
        }
        .search-box:focus, .search-box:hover { border-color: #d48383; transform: scale(1.02); box-shadow: 0 6px 20px rgba(212, 131, 131, 0.15); }
        .header-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

        .content-canvas { flex: 1; position: relative; overflow-y: auto; overflow-x: hidden; padding: 32px; }
        #bookmarkContainer { width: 100%; max-width: 1600px; margin: 0 auto; display: grid; gap: 24px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }

        .toast-tip {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(50px);
            background: #fff8f3; border: 2px solid #ecd5cc; color: #a34848; padding: 10px 24px;
            border-radius: 20px; font-size: 14px; font-weight: 600; box-shadow: 0 10px 25px rgba(210, 185, 170, 0.25);
            transition: transform 0.3s ease, opacity 0.3s ease; opacity: 0; z-index: 400; pointer-events: none;
        }
        .toast-tip.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(92, 75, 67, 0.45); backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center; z-index: 300;
        }
        .modal {
            background: #fff8f3; border: 2px solid #f2dfd6; border-radius: 16px; padding: 24px; width: 440px;
            box-shadow: 0 12px 30px rgba(210, 185, 170, 0.25); display: flex; flex-direction: column; gap: 16px;
        }
        .modal h3 { color: #b56565; font-size: 16px; font-weight: 700; }
        .modal input, .modal select {
            background: #fff; border: 2px solid #ecd5cc; padding: 10px 14px; border-radius: 12px; color: #5c4b43; outline: none; width: 100%;
        }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; }
        .modal-btn { padding: 6px 16px; border-radius: 10px; cursor: pointer; font-size: 13px; border: none; font-weight: 500; }
        .modal-btn.cancel { background: #f0ded6; color: #8c7368; }
        .modal-btn.confirm { background: #f4d6cc; color: #a34848; }
    </style>
</head>
<body>

    <!-- 🔒 公开网站访问密码保护罩（访客端拦截） -->
    <div id="publicPasswordShield" style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(92, 75, 67, 0.9); backdrop-filter:blur(16px); display:none; justify-content:center; align-items:center; z-index:999999;">
        <div style="background:#fff8f3; border:2px solid #f2dfd6; border-radius:20px; padding:32px; width:90%; max-width:400px; box-shadow:0 20px 50px rgba(0,0,0,0.4); text-align:center; display:flex; flex-direction:column; gap:16px;">
            <h3 style="color:#b56565; font-size:18px; font-weight:700;">🔒 公开网站访问验证</h3>
            <p style="font-size:13px; color:#8c7368; line-height:1.4;">此为受密码保护的临时公开空间，请输入密码查看：</p>
            <input type="password" id="publicShieldInput" placeholder="请输入访问密码..." style="width:100%; box-sizing:border-box; background:#fff; border:2px solid #ecd5cc; color:#5c4b43; padding:12px 14px; border-radius:12px; font-size:14px; outline:none;" onkeydown="if(event.key==='Enter') verifyPublicPassword()">
            <button onclick="verifyPublicPassword()" style="background:#f4d6cc; border:none; color:#a34848; padding:12px; border-radius:12px; font-size:14px; font-weight:600; cursor:pointer;">确认进入</button>
        </div>
    </div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>✨ MarkFlow</h2>
        </div>
        <div class="sidebar-bottom-actions">
            <!-- 🚀 一键同步并发布到公开仓库按钮 -->
            <button class="sidebar-action-btn sync-primary" onclick="syncToPublicRepo()" title="将当前最新状态加密打包并发布至公开仓库">
                🚀 <span>一键发布到公网仓库</span>
            </button>
            <button class="sidebar-action-btn" onclick="openGithubAuthModal()" title="绑定仓库">
                ☁️ <span>绑定私有仓库</span>
            </button>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <input type="text" class="search-box" placeholder="MarkFlow 搜索空间..." readonly>
            <div class="header-right">
                <button class="header-action-btn sync-btn-header" onclick="openGithubAuthModal()" title="绑定仓库">☁️</button>
            </div>
        </div>
        <div class="content-canvas">
            <div id="bookmarkContainer">
                <div style="background:white; padding:24px; border-radius:16px; border:1.5px solid #f2dfd6;">
                    <h3 style="color:#b56565; margin-bottom:8px;">📌 欢迎使用 MarkFlow 管理面板</h3>
                    <p style="font-size:14px; color:#8c7368; line-height:1.6;">点击左侧下方的“一键发布到公网仓库”，即可自动读取同目录下的 `.md` 密码文件，将此页面连同密码加密罩一键同步到你的公开仓库中！</p>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-tip" id="toastTip">同步成功</div>

    <!-- GitHub 绑定弹窗 -->
    <div class="modal-overlay" id="githubAuthModal">
        <div class="modal">
            <h3>☁️ 绑定私有仓库设置</h3>
            <p style="font-size: 13px; color: #8c7368;">输入您的 GitHub Personal Access Token：</p>
            <input type="password" id="ghTokenInput" placeholder="ghp_xxxxxxxxxxxx">
            <p style="font-size: 13px; color: #8c7368; margin-top: 4px;">输入目标私有仓库 (格式: 用户名/仓库名)：</p>
            <input type="text" id="ghPrivateRepoInput" placeholder="myname/my-private-repo">
            <div class="modal-buttons" style="margin-top: 8px;">
                <button class="modal-btn cancel" onclick="closeGithubAuthModal()">取消</button>
                <button class="modal-btn confirm" onclick="saveRepoConfig()">保存配置</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. 公开端密码校验逻辑（发布到公网后自动生效）
        // ==========================================
        const CORRECT_PASSWORD_PLACEHOLDER = "my_secure_password_123"; // 同步时会自动被 .md 中的密码替换

        (function() {
            // 如果不是在本地调试（或者你希望本地也测试密码，可去掉 location.hostname 判断）
            const isPublicPage = true; // 可根据需要调整判断条件
            if (isPublicPage && sessionStorage.getItem('markflow_public_auth') !== 'true') {
                document.getElementById('publicPasswordShield').style.display = 'flex';
            }
        })();

        function verifyPublicPassword() {
            const inputVal = document.getElementById('publicShieldInput').value.trim();
            if (inputVal === CORRECT_PASSWORD_PLACEHOLDER) {
                sessionStorage.setItem('markflow_public_auth', 'true');
                document.getElementById('publicPasswordShield').style.display = 'none';
            } else {
                alert('❌ 密码错误，请重新输入！');
                document.getElementById('publicShieldInput').value = '';
                document.getElementById('publicShieldInput').focus();
            }
        }

        // ==========================================
        // 2. 仓库绑定与管理面板交互
        // ==========================================
        function openGithubAuthModal() {
            document.getElementById('githubAuthModal').style.display = 'flex';
            document.getElementById('ghTokenInput').value = localStorage.getItem('gh_token') || '';
            document.getElementById('ghPrivateRepoInput').value = localStorage.getItem('gh_private_repo') || '';
        }
        function closeGithubAuthModal() {
            document.getElementById('githubAuthModal').style.display = 'none';
        }
        function saveRepoConfig() {
            const token = document.getElementById('ghTokenInput').value.trim();
            const repo = document.getElementById('ghPrivateRepoInput').value.trim();
            if(!token || !repo) { alert('请填写完整信息'); return; }
            localStorage.setItem('gh_token', token);
            localStorage.setItem('gh_private_repo', repo);
            closeGithubAuthModal();
            showToast('✅ 绑定配置保存成功');
        }

        function showToast(msg) {
            const toast = document.getElementById('toastTip');
            toast.innerText = msg || '同步成功';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // ==========================================
        // 3. 核心：一键同步到公开仓库（读取 .md 并发布）
        // ==========================================
        async function syncToPublicRepo() {
            const token = localStorage.getItem('gh_token');
            const privateRepo = localStorage.getItem('gh_private_repo');
            // 你指定的公开仓库名称（可以改成你自己的公开库，如 "username/public-site"）
            const publicRepo = prompt("请输入你要同步发布的【公开仓库名称】(格式: 用户名/公开仓库名):", localStorage.getItem('gh_public_repo') || "");
            
            if (!token || !privateRepo || !publicRepo) {
                alert('请先完整绑定私有仓库配置，并输入公开仓库名！');
                openGithubAuthModal();
                return;
            }
            localStorage.setItem('gh_public_repo', publicRepo);

            try {
                showToast('⏳ 正在读取同目录下的 .md 密码配置...');

                // 第一步：读取私有仓库同目录下的 .md 密码文件（例如命名为 sync-config.md）
                let sitePassword = "my_secure_password_123"; // 默认兜底密码
                const mdRes = await fetch(`https://api.github.com/repos/${privateRepo}/contents/sync-config.md`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (mdRes.ok) {
                    const mdData = await mdRes.json();
                    const mdText = decodeURIComponent(escape(atob(mdData.content)));
                    const match = mdText.match(/password:\s*(.+)/i);
                    if (match && match[1]) {
                        sitePassword = match[1].trim();
                    }
                } else {
                    console.warn("未检测到 sync-config.md，将使用默认密码。");
                }

                showToast('🚀 正在编译并打包公开版页面...');

                // 第二步：获取当前页面 HTML 源码，并将占位符密码动态替换为从 .md 中读出的真实密码
                let publicHtmlContent = document.documentElement.outerHTML;
                publicHtmlContent = publicHtmlContent.replace(
                    `const CORRECT_PASSWORD_PLACEHOLDER = "${CORRECT_PASSWORD_PLACEHOLDER}";`,
                    `const CORRECT_PASSWORD_PLACEHOLDER = "${sitePassword}";`
                );

                // 第三步：推送到公开仓库的 index.html
                const pubPath = 'index.html';
                const pubUrl = `https://api.github.com/repos/${publicRepo}/contents/${pubPath}`;
                
                let pubFileSha = '';
                const getPubRes = await fetch(pubUrl, { headers: { 'Authorization': `Bearer ${token}` } });
                if (getPubRes.ok) {
                    const pubInfo = await getPubRes.json();
                    pubFileSha = pubInfo.sha;
                }

                const encodedHtml = btoa(unescape(encodeURIComponent(publicHtmlContent)));
                const putPubRes = await fetch(pubUrl, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: '🚀 MarkFlow 自动同步公开版网页',
                        content: encodedHtml,
                        sha: pubFileSha || undefined
                    })
                });

                if (putPubRes.ok) {
                    showToast('🎉 成功发布到公网仓库！');
                    alert('✨ 网页已成功同步至公开仓库！\n访客打开公网链接时将弹出密码验证框，输入你 .md 文件中设定的密码后即可正常访问。');
                } else {
                    const errJson = await putPubRes.json();
                    alert('❌ 发布到公开仓库失败: ' + (errJson.message || '未知错误'));
                }
            } catch (err) {
                console.error(err);
                alert('同步过程发生网络异常或权限错误。');
            }
        }
    </script>
</body>
</html>
