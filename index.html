<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MarkFlow - 沉浸手帐空间</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #fdfbf7;
            color: #5c4b43;
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(#f1e1d6 1.5px, transparent 1.5px);
            background-size: 28px 28px;
        }

        /* 移动端顶部导航栏（PC默认隐藏，移动端媒体查询展示） */
        .mobile-header {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 56px;
            background: rgba(255, 248, 243, 0.95);
            backdrop-filter: blur(4px);
            border-bottom: 2px dashed #f2dfd6;
            z-index: 120;
            padding: 0 16px;
            align-items: center;
            justify-content: space-between;
        }
        .mobile-header h2 { font-size: 16px; color: #d48383; font-weight: 700; }
        .mobile-menu-toggle {
            background: #f4d6cc; border: none; color: #a34848;
            width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer;
        }

        /* 左侧菜单栏（桌面端） */
        .sidebar {
            width: 260px;
            background: rgba(255, 248, 243, 0.95);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            padding: 24px 16px;
            z-index: 130;
            transition: width 0.3s ease, padding 0.3s ease, transform 0.3s ease;
            position: relative;
            box-shadow: 4px 0 20px rgba(210, 180, 160, 0.08);
            flex-shrink: 0;
            border-right: 2px dashed #f2dfd6;
            overflow-y: auto;
        }
        .sidebar.collapsed {
            width: 76px;
            padding: 24px 10px;
        }
        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-left: 4px;
        }
        .sidebar.collapsed .sidebar-header {
            justify-content: center;
            padding-left: 0;
        }
        .sidebar h2 {
            font-size: 17px;
            color: #d48383;
            font-weight: 700;
            letter-spacing: 1px;
            white-space: nowrap;
            overflow: hidden;
            transition: opacity 0.2s;
        }
        .sidebar.collapsed h2 { opacity: 0; width: 0; margin: 0; display: none; }
        
        .toggle-btn {
            background: #f4d6cc;
            border: none;
            color: #a34848;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.3s;
            flex-shrink: 0;
            box-shadow: 0 2px 5px rgba(212, 131, 131, 0.2);
        }
        .toggle-btn:hover { background: #e2ab9d; color: #fff; transform: scale(1.1); }
        .sidebar.collapsed .toggle-btn { margin: 0 auto; }

        .menu-item {
            padding: 10px 14px;
            border-radius: 12px;
            cursor: pointer;
            color: #8c7368;
            margin-bottom: 6px;
            font-size: 14px;
            transition: all 0.2s ease;
            background: transparent;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
        }
        .sidebar.collapsed .menu-item {
            justify-content: center;
            padding: 10px 0;
        }
        .menu-item:hover { background: #faede6; color: #b56565; }
        .menu-item.active {
            background: #f4d6cc;
            color: #a34848;
            box-shadow: 0 4px 10px rgba(212, 131, 131, 0.15);
            font-weight: 600;
        }
        .menu-item .arrow {
            margin-left: auto;
            transition: transform 0.2s;
        }
        .sidebar.collapsed .menu-item .arrow { display: none; }
        .menu-item.collapsed-cat .arrow {
            transform: rotate(-90deg);
        }

        .sidebar.collapsed .menu-text,
        .sidebar.collapsed .sub-menu-container,
        .sidebar.collapsed .add-note-sub-btn,
        .sidebar.collapsed .bookmark-sub-container,
        .sidebar.collapsed .sidebar-avatar-card,
        .sidebar.collapsed .sidebar-bottom-actions { display: none; }

        .sub-menu-container, .bookmark-sub-container {
            padding-left: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 6px;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        .bookmark-sub-container.collapsed, .sub-menu-container.collapsed {
            max-height: 0 !important;
            margin-bottom: 0;
        }

        .sub-menu-item {
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            color: #8c7368;
            font-size: 13px;
            transition: all 0.2s;
            background: #fffbf8;
            border: 1px solid #faede6;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .sub-menu-item:hover { background: #faede6; color: #b56565; }
        .sub-menu-item.active {
            background: #f4d6cc;
            color: #a34848;
            font-weight: 600;
            border-color: #f2dfd6;
        }
        .sub-menu-left {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
            justify-content: flex-start;
        }
        .sub-delete-btn {
            background: none;
            border: none;
            color: #c49a9a;
            font-size: 14px;
            cursor: pointer;
            padding: 0 4px;
            border-radius: 4px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .sub-menu-item:hover .sub-delete-btn { opacity: 1; }
        .sub-delete-btn:hover { background: #f4d6cc; color: #a34848; }

        .add-note-sub-btn {
            background: none;
            border: 1.5px dashed #ecd5cc;
            color: #b56565;
            padding: 6px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            text-align: center;
            margin-bottom: 8px;
            transition: all 0.2s;
        }
        .add-note-sub-btn:hover { background: #faede6; border-color: #d48383; }

        /* 左侧开源网站头像卡片样式 */
        .sidebar-avatar-card {
            margin-bottom: 16px;
            background: #fffbf8;
            border: 1.5px solid #ecd5cc;
            border-radius: 14px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #5c4b43;
            box-shadow: 0 4px 12px rgba(210, 185, 170, 0.1);
            transition: all 0.2s ease;
        }
        .sidebar.collapsed .sidebar-avatar-card {
            justify-content: center;
            padding: 8px;
            width: 44px;
            height: 44px;
            margin: 0 auto 16px auto;
            border-radius: 50%;
        }
        .sidebar-avatar-card:hover {
            background: #faede6;
            border-color: #d48383;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(212, 131, 131, 0.15);
        }
        .sidebar-avatar-img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #f4d6cc;
            flex-shrink: 0;
            background: #fff;
        }
        .sidebar.collapsed .sidebar-avatar-img {
            width: 32px;
            height: 32px;
            border-width: 1px;
        }
        .sidebar-avatar-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
        }
        .sidebar.collapsed .sidebar-avatar-info { display: none; }
        .sidebar-avatar-title {
            font-size: 13px;
            font-weight: 700;
            color: #b56565;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sidebar-avatar-desc {
            font-size: 11px;
            color: #b5a49c;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 左侧底部导入导出及清空按钮区域 */
        .sidebar-bottom-actions {
            margin-top: auto;
            padding-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .sidebar-action-btn {
            background: #fffbf8;
            border: 1.5px solid #ecd5cc;
            color: #8c7368;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .sidebar-action-btn:hover {
            background: #faede6;
            color: #b56565;
            border-color: #d48383;
        }
        .sidebar-action-btn.danger {
            color: #c45555;
            border-color: #f0ded6;
        }
        .sidebar-action-btn.danger:hover {
            background: #fdf2f2;
            border-color: #d48383;
            color: #a33838;
        }

        /* 右侧主内容区 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .header {
            padding: 20px 36px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(253, 251, 247, 0.6);
            backdrop-filter: blur(4px);
            position: relative;
            z-index: 50;
        }
        .search-box {
            background: #fff;
            border: 2px solid #ecd5cc;
            padding: 10px 20px;
            border-radius: 20px;
            color: #5c4b43;
            width: 400px;
            outline: none;
            font-size: 14px;
            transition: all 0.3s;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            text-align: center;
            cursor: pointer;
        }
        .search-box:focus {
            border-color: #d48383;
            box-shadow: 0 0 0 4px rgba(212, 131, 131, 0.1), inset 0 2px 4px rgba(0,0,0,0.02);
            text-align: left;
            cursor: text;
        }
        
        .header-right {
            position: absolute;
            right: 36px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .add-card-btn-header {
            background: #f0ded6;
            border: 2px solid #ecd5cc;
            color: #8c4343;
            padding: 0 14px;
            height: 38px;
            border-radius: 19px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(212, 131, 131, 0.1);
        }
        .add-card-btn-header:hover { background: #e2ab9d; color: #fff; }

        .add-btn-header {
            background: #f4d6cc;
            border: 2px solid #ecd5cc;
            color: #a34848;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(212, 131, 131, 0.15);
        }
        .add-btn-header:hover { background: #e2ab9d; color: #fff; transform: scale(1.05); }

        .sync-btn-header {
            background: #fff;
            border: 2px solid #ecd5cc;
            color: #b56565;
            padding: 0 14px;
            height: 38px;
            border-radius: 19px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(212, 131, 131, 0.1);
        }
        .sync-btn-header:hover { background: #faede6; border-color: #d48383; }

        /* 沉浸式独立综合搜索全屏页面 */
        .search-fullscreen-view {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #fdfbf7;
            z-index: 150;
            display: none;
            flex-direction: column;
            padding: 30px 80px;
            overflow-y: auto;
        }
        .search-fullscreen-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .search-back-btn {
            background: #f4d6cc;
            border: none;
            color: #a34848;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .search-back-btn:hover { background: #e2ab9d; color: #fff; }
        .search-fullscreen-input {
            flex: 1;
            background: #fff;
            border: 2px solid #d48383;
            padding: 12px 24px;
            border-radius: 24px;
            font-size: 16px;
            color: #5c4b43;
            outline: none;
            box-shadow: 0 4px 20px rgba(212, 131, 131, 0.15);
        }

        /* 标签页切换栏 + 清除记录快捷按钮 */
        .search-tabs-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 2px dashed #f2dfd6;
            padding-bottom: 14px;
        }
        .search-tabs-group {
            display: flex;
            gap: 12px;
        }
        .search-tab-btn {
            background: #fff;
            border: 1.5px solid #ecd5cc;
            color: #8c7368;
            padding: 8px 20px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .search-tab-btn:hover {
            background: #faede6;
            color: #b56565;
        }
        .search-tab-btn.active {
            background: #f4d6cc;
            border-color: #d48383;
            color: #a34848;
            box-shadow: 0 4px 10px rgba(212, 131, 131, 0.2);
        }
        .clear-history-btn {
            background: #fffbf8;
            border: 1.5px dashed #d48383;
            color: #b56565;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .clear-history-btn:hover {
            background: #faede6;
            border-color: #a34848;
        }

        .search-section-panel {
            display: none;
            flex-direction: column;
            gap: 20px;
        }
        .search-section-panel.active {
            display: flex;
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: #b56565;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .search-results-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 500px;
            overflow-y: auto;
            padding-right: 6px;
        }
        .search-results-list::-webkit-scrollbar {
            width: 8px;
        }
        .search-results-list::-webkit-scrollbar-track {
            background: #faede6;
            border-radius: 10px;
        }
        .search-results-list::-webkit-scrollbar-thumb {
            background: #d48383;
            border-radius: 10px;
        }

        .search-result-item {
            background: #fff;
            border: 1.5px solid #ecd5cc;
            padding: 16px 20px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: #5c4b43;
            transition: all 0.2s;
        }
        .search-result-item:hover {
            background: #faede6;
            border-color: #d48383;
        }
        .search-result-title { font-weight: 600; color: #b56565; font-size: 15px; }
        .search-result-url { font-size: 13px; color: #b5a49c; }
        .search-result-badge { font-size: 12px; background: #faede6; color: #d48383; padding: 4px 10px; border-radius: 8px; font-weight: 600; }

        /* 极简纯图标缩放栏 */
        .zoom-control-bar {
            position: absolute;
            bottom: 30px;
            right: 30px;
            background: rgba(255, 248, 243, 0.95);
            backdrop-filter: blur(4px);
            border: 2px solid #ecd5cc;
            padding: 6px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 100;
            box-shadow: 0 8px 20px rgba(210, 185, 170, 0.2);
        }
        .zoom-icon-btn {
            background: #fffbf8;
            border: 1px solid #ecd5cc;
            color: #a34848;
            width: 32px; height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.2s;
            user-select: none;
        }
        .zoom-icon-btn:hover { background: #f4d6cc; color: #fff; transform: scale(1.08); }
        
        .content-canvas {
            flex: 1;
            position: relative;
            overflow: auto;
            padding: 40px;
        }

        #bookmarkContainer {
            position: relative;
            width: 3000px;
            height: 3000px;
            transform-origin: 0 0;
            transition: transform 0.1s ease-out;
        }

        .notes-page-immersive {
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            height: 100%;
            background: transparent;
            padding: 10px 20px 50px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
        }
        
        .notes-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.85);
            padding: 10px 20px;
            border-radius: 14px;
            border: 1.5px solid #ecd5cc;
            flex-wrap: wrap;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(210, 185, 170, 0.08);
        }
        .toolbar-group {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .tool-btn {
            background: #fffbf8;
            border: 1px solid #ecd5cc;
            color: #8c7368;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        .tool-btn:hover { background: #f4d6cc; color: #a34848; }

        .sticker-toggle-btn {
            background: #f4d6cc;
            border: 1px solid #d48383;
            color: #a34848;
            padding: 6px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .sticker-toggle-btn:hover { background: #e2ab9d; color: #fff; }

        .sticker-panel {
            display: none;
            background: #fff8f3;
            border: 1.5px dashed #ecd5cc;
            padding: 14px 18px;
            border-radius: 14px;
            gap: 14px;
            align-items: center;
            flex-wrap: wrap;
            box-shadow: 0 4px 15px rgba(210, 185, 170, 0.1);
        }
        .sticker-item {
            font-size: 28px;
            cursor: grab;
            padding: 4px;
            border-radius: 8px;
            transition: transform 0.2s, background 0.2s;
            user-select: none;
        }
        .sticker-item:active { cursor: grabbing; }
        .sticker-item:hover { transform: scale(1.2); background: #faede6; }
        
        .custom-sticker-img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 8px;
            cursor: grab;
            border: 1px solid #ecd5cc;
            transition: transform 0.2s;
        }
        .custom-sticker-img:active { cursor: grabbing; }
        .custom-sticker-img:hover { transform: scale(1.15); }

        .custom-sticker-upload {
            background: #fff;
            border: 1.5px dashed #d48383;
            color: #b56565;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
        }
        .custom-sticker-upload:hover { background: #faede6; }

        .notes-editor-title {
            font-size: 38px;
            font-weight: 700;
            color: #b56565;
            border: none;
            outline: none;
            width: 100%;
            font-family: inherit;
            background: transparent;
            letter-spacing: 1px;
        }

        .notes-editor-body {
            flex: 1;
            border: none;
            outline: none;
            font-size: 17px;
            color: #5c4b43;
            line-height: 2.2;
            font-family: inherit;
            width: 100%;
            position: relative;
            min-height: 350px;
        }
        .notes-editor-body h1 { font-size: 38px !important; font-weight: 800 !important; color: #b56565 !important; margin: 20px 0 10px 0 !important; line-height: 1.3 !important; }
        .notes-editor-body h2 { font-size: 30px !important; font-weight: 700 !important; color: #c27878 !important; margin: 16px 0 8px 0 !important; line-height: 1.3 !important; }
        .notes-editor-body h3 { font-size: 22px !important; font-weight: 700 !important; color: #d48383 !important; margin: 14px 0 6px 0 !important; line-height: 1.3 !important; }
        .notes-editor-body h4 { font-size: 17px !important; font-weight: 600 !important; color: #8c7368 !important; margin: 12px 0 4px 0 !important; line-height: 1.3 !important; }
        .notes-editor-body p { margin-bottom: 14px; font-size: 17px; }
        
        .notes-editor-body blockquote {
            background: #faede6;
            border-left: 4px solid #d48383;
            padding: 14px 20px;
            border-radius: 0 12px 12px 0;
            color: #a34848;
            margin: 16px 0;
            font-style: italic;
        }
        .notes-editor-body ul, .notes-editor-body ol {
            padding-left: 24px;
            margin-bottom: 14px;
        }
        .notes-editor-body li {
            margin-bottom: 6px;
        }

        .notes-status-bar {
            display: flex;
            justify-content: flex-end;
            gap: 20px;
            font-size: 13px;
            color: #b5a49c;
            padding-top: 10px;
            border-top: 2px dotted #faede6;
            user-select: none;
        }

        .note-sticker-placed {
            position: absolute;
            cursor: move;
            user-select: none;
            z-index: 20;
            display: inline-block;
            padding: 10px 10px 14px 10px;
            background: #fff8f3;
            border: 2px solid #f2dfd6;
            border-radius: 14px;
            box-shadow: 0 10px 28px rgba(210, 185, 170, 0.28);
            transition: box-shadow 0.2s, border-color 0.2s;
            transform-origin: center center;
        }
        .note-sticker-placed.selected {
            border-color: #d48383;
            box-shadow: 0 0 0 3px rgba(212, 131, 131, 0.3), 0 10px 28px rgba(210, 185, 170, 0.28);
            z-index: 50;
        }
        .note-sticker-placed img {
            display: block;
            border-radius: 8px;
            pointer-events: none;
            max-width: none;
        }
        .note-sticker-placed span {
            font-size: 50px;
            display: block;
            line-height: 1;
        }
        .sticker-resize-handle {
            position: absolute;
            right: -6px;
            bottom: -6px;
            width: 16px;
            height: 16px;
            background: #d48383;
            border: 2px solid #fff;
            border-radius: 50%;
            cursor: nwse-resize;
            display: none;
            z-index: 30;
        }
        .sticker-rotate-handle {
            position: absolute;
            top: -16px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 14px;
            background: #d48383;
            border: 2px solid #fff;
            border-radius: 50%;
            cursor: grab;
            display: none;
            z-index: 30;
        }
        .sticker-rotate-handle:active { cursor: grabbing; }

        .note-sticker-placed:hover .sticker-resize-handle,
        .note-sticker-placed.selected .sticker-resize-handle,
        .note-sticker-placed:hover .sticker-rotate-handle,
        .note-sticker-placed.selected .sticker-rotate-handle {
            display: block;
        }

        .image-preview-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(92, 75, 67, 0.7);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 500;
            cursor: zoom-out;
        }
        .image-preview-modal img {
            max-width: 85vw;
            max-height: 85vh;
            border-radius: 16px;
            border: 4px solid #fff8f3;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            object-fit: contain;
            background: #fff;
        }

        .toast-tip {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(50px);
            background: #fff8f3;
            border: 2px solid #ecd5cc;
            color: #a34848;
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(210, 185, 170, 0.25);
            transition: transform 0.3s ease, opacity 0.3s ease;
            opacity: 0;
            z-index: 300;
        }
        .toast-tip.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* 手帐卡片样式 */
        .card-group {
            position: absolute;
            width: 320px;
            background: #ffffff;
            border: 2px solid #f2dfd6;
            border-radius: 16px;
            padding: 22px 20px 20px 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 12px 32px rgba(210, 185, 170, 0.18);
            cursor: grab;
            user-select: none;
        }
        .card-group:active { cursor: grabbing; z-index: 120; }
        .card-group::before {
            content: '';
            position: absolute;
            top: -10px; left: 50%;
            transform: translateX(-50%);
            width: 90px; height: 22px;
            background: rgba(244, 214, 204, 0.75);
            border-radius: 3px;
        }
        .card-group:nth-child(2n)::before { background: rgba(212, 227, 218, 0.75); }
        .card-group:nth-child(3n)::before { background: rgba(238, 221, 207, 0.75); }

        .card-group-title {
            font-size: 15px; font-weight: 700; margin-bottom: 16px;
            color: #b56565; border-bottom: 2px dotted #faede6; padding-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .card-group-right { display: flex; align-items: center; gap: 8px; }
        .card-group-title .count-badge { background: #faede6; color: #d48383; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
        .delete-card-btn {
            background: none; border: none; color: #c49a9a; cursor: pointer; font-size: 14px;
            padding: 0 4px; border-radius: 4px; opacity: 0; transition: opacity 0.2s;
        }
        .card-group:hover .delete-card-btn { opacity: 1; }
        .delete-card-btn:hover { background: #f4d6cc; color: #a34848; }
        
        .bookmark-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 10px; border-radius: 10px; margin-bottom: 6px; font-size: 14px;
            background: #fffbf8; border: 1px solid #faede6;
        }
        .bookmark-item:hover { background: #faede6; border-color: #f2dfd6; }
        .bookmark-link {
            color: #6b564d; text-decoration: none; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap; flex: 1; margin-right: 10px; font-weight: 500;
        }
        .bookmark-link:hover { color: #a34848; text-decoration: underline; }
        .empty-card-tip { text-align: center; color: #b5a49c; font-size: 13px; padding: 12px 0; font-style: italic; }

        .card-add-btn {
            margin-top: 8px; background: #fffbf8; border: 2px dashed #ecd5cc; color: #b56565;
            padding: 8px; border-radius: 10px; text-align: center; font-size: 13px; font-weight: 600;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .card-add-btn:hover { background: #faede6; border-color: #d48383; color: #a34848; }
        
        .actions { display: flex; gap: 6px; opacity: 0; transition: opacity 0.2s; }
        .bookmark-item:hover .actions { opacity: 1; }
        .btn { background: #f4d6cc; border: none; color: #8c4343; cursor: pointer; font-size: 12px; padding: 2px 8px; border-radius: 6px; font-weight: 500; }
        .btn:hover { background: #e2ab9d; color: #fff; }

        /* 弹窗样式 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(92, 75, 67, 0.4); backdrop-filter: blur(2px);
            display: none; justify-content: center; align-items: center; z-index: 200;
        }
        .modal {
            background: #fff8f3; border: 2px solid #f2dfd6; border-radius: 16px;
            padding: 24px; width: 440px; box-shadow: 0 12px 30px rgba(210, 185, 170, 0.25);
            display: flex; flex-direction: column; gap: 16px;
        }
        .modal h3 { color: #b56565; font-size: 16px; font-weight: 700; }
        .modal input, .modal select {
            background: #fff; border: 2px solid #ecd5cc; padding: 10px 14px;
            border-radius: 12px; color: #5c4b43; outline: none; font-size: 14px; width: 100%;
        }
        .category-selector-label { font-size: 13px; color: #8c7368; font-weight: 500; }
        .category-tags { display: flex; flex-wrap: wrap; gap: 8px; max-height: 100px; overflow-y: auto; }
        .category-tag {
            background: #fff; border: 1.5px solid #ecd5cc; padding: 6px 12px; border-radius: 10px; font-size: 13px; color: #6b564d; cursor: pointer;
        }
        .category-tag.selected { background: #f4d6cc; border-color: #d48383; color: #a34848; font-weight: 600; }

        .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; }
        .modal-btn { padding: 6px 16px; border-radius: 10px; cursor: pointer; font-size: 13px; border: none; font-weight: 500; }
        .modal-btn.cancel { background: #f0ded6; color: #8c7368; }
        .modal-btn.confirm { background: #f4d6cc; color: #a34848; }
        .modal-btn.confirm:hover { background: #e2ab9d; color: #fff; }

        /* 移动端自适应媒体查询（完美适配手机端 UI 交互） */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .mobile-header { display: flex; }
            .sidebar {
                position: fixed;
                top: 56px; left: -280px;
                height: calc(100vh - 56px);
                width: 280px !important;
                z-index: 140;
                transition: transform 0.3s ease;
                box-shadow: 10px 0 30px rgba(0,0,0,0.1);
            }
            .sidebar.mobile-open {
                transform: translateX(280px);
            }
            .sidebar .toggle-btn { display: none; } /* 移动端隐藏折叠圆钮 */
            .main-content {
                margin-top: 56px;
                height: calc(100vh - 56px);
            }
            .header {
                padding: 12px 16px;
            }
            .search-box {
                width: 100%;
                font-size: 13px;
                padding: 8px 14px;
            }
            .header-right {
                right: 16px;
                gap: 6px;
            }
            .add-card-btn-header, .sync-btn-header {
                height: 32px;
                padding: 0 10px;
                font-size: 12px;
            }
            .add-btn-header {
                width: 32px; height: 32px;
                font-size: 16px;
            }
            .card-group {
                width: 290px;
            }
            .search-fullscreen-view {
                padding: 20px 20px;
            }
            .zoom-control-bar {
                bottom: 20px; right: 20px;
                padding: 4px 8px;
            }
            .zoom-icon-btn {
                width: 28px; height: 28px;
                font-size: 14px;
            }
            .modal {
                width: 90vw;
                padding: 18px;
            }
        }
    </style>
</head>
<body>

    <!-- 移动端顶部导航栏 -->
    <div class="mobile-header">
        <h2>✨ MarkFlow 移动端空间</h2>
        <button class="mobile-menu-toggle" onclick="toggleMobileSidebar()">☰</button>
    </div>

    <!-- 左侧菜单栏 -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>✨ MarkFlow</h2>
            <button class="toggle-btn" onclick="toggleSidebar()" title="收起/展开菜单">❤️</button>
        </div>
        
        <!-- 开源网站头像跳转卡片 -->
        <a href="https://github.com/guguli685-creator/Xl-markflow" class="sidebar-avatar-card" target="_blank" title="访问 Xl-markflow 开源仓库">
            <img src="https://github.com/guguli685-creator.png" alt="Xl-markflow Logo" class="sidebar-avatar-img">
            <div class="sidebar-avatar-info">
                <span class="sidebar-avatar-title">Xl-markflow</span>
                <span class="sidebar-avatar-desc">开源手帐与书签空间</span>
            </div>
        </a>

        <div id="menuList"></div>

        <!-- 导入、导出及清空所有数据按钮 -->
        <div class="sidebar-bottom-actions">
            <input type="file" id="importFile" accept=".html,.htm" style="display:none" onchange="handleImportBookmarks(event)">
            <button class="sidebar-action-btn" onclick="document.getElementById('importFile').click()" title="导入 HTML 书签">
                📥 <span>导入 HTML 书签</span>
            </button>
            <button class="sidebar-action-btn" onclick="exportHtmlBookmarks()" title="导出 HTML 书签">
                📤 <span>导出 HTML 书签</span>
            </button>
            <button class="sidebar-action-btn danger" onclick="clearAllData()" title="清空所有数据">
                🗑️ <span>清空所有数据</span>
            </button>
        </div>
    </div>

    <!-- 右侧主内容区 -->
    <div class="main-content">
        <div class="header" id="topHeader">
            <input type="text" class="search-box" placeholder="点击进入沉浸式书签与笔记综合检索..." id="searchInput" readonly onclick="openSearchFullscreen()">
            <div class="header-right">
                <button class="sync-btn-header" onclick="openGithubAuthModal()" title="绑定GitHub云端仓库">☁️ 同步仓库</button>
                <button class="add-card-btn-header" id="headerActionBtn" onclick="openCardModal()" title="新建空白卡片分类">📁 新建卡片</button>
                <button class="add-btn-header" id="headerAddBtn" onclick="openBookmarkModal()" title="添加新书签">+</button>
            </div>
        </div>
        
        <!-- 书签自由画布 -->
        <div class="content-canvas" id="canvasScrollWrapper" onclick="closeMobileSidebarOnClickOutside(event)">
            <div id="bookmarkContainer"></div>
        </div>

        <!-- 极简纯图标缩放栏 -->
        <div class="zoom-control-bar" id="zoomControlBar">
            <button class="zoom-icon-btn" onclick="adjustZoom(0.1)" title="放大">+</button>
            <button class="zoom-icon-btn" onclick="adjustZoom(-0.1)" title="缩小" oncontextmenu="handleRightClickZoom(event)">-</button>
            <button class="zoom-icon-btn" onclick="resetZoom()" title="重置视角">🏠</button>
        </div>

        <!-- 沉浸式独立综合搜索全屏页面 -->
        <div class="search-fullscreen-view" id="searchFullscreenView">
            <div class="search-fullscreen-header">
                <button class="search-back-btn" onclick="closeSearchFullscreen()">← 返回主空间</button>
                <input type="text" class="search-fullscreen-input" placeholder="键入关键词实时检索所有书签与笔记..." id="fullscreenSearchInput" oninput="handleFullscreenSearch()" autofocus>
            </div>
            
            <!-- 标签页切换栏 + 清除记录快捷按钮 -->
            <div class="search-tabs-bar">
                <div class="search-tabs-group">
                    <button class="search-tab-btn active" id="tabBookmarkBtn" onclick="switchSearchTab('bookmark')">🔖 书签板块</button>
                    <button class="search-tab-btn" id="tabNoteBtn" onclick="switchSearchTab('note')">📖 笔记板块</button>
                </div>
                <button class="clear-history-btn" onclick="clearSearchHistoryInput()">🧹 清除记录</button>
            </div>

            <!-- 书签板块面板 -->
            <div class="search-section-panel active" id="panelBookmark">
                <div class="section-title">📌 检索结果（点击直接访问）</div>
                <div class="search-results-list" id="searchResultsList"></div>
            </div>

            <!-- 笔记板块面板 -->
            <div class="search-section-panel" id="panelNote">
                <div class="section-title">📖 笔记检索结果（点击跳转到对应页面）</div>
                <div class="search-results-list" id="notesSearchResultsList"></div>
            </div>
        </div>

        <!-- 沉浸式手帐笔记专用写作页面 -->
        <div class="content-canvas" id="notesContainer" style="display: none;" onclick="closeMobileSidebarOnClickOutside(event)">
            <div class="notes-page-immersive" id="notesPageBody" ondragover="allowDrop(event)" ondrop="handleDropSticker(event)" onclick="handlePageClick(event)">
                
                <!-- 富文本工具栏 -->
                <div class="notes-toolbar">
                    <div class="toolbar-group">
                        <button class="tool-btn" onclick="formatText('H1')">H1</button>
                        <button class="tool-btn" onclick="formatText('H2')">H2</button>
                        <button class="tool-btn" onclick="formatText('H3')">H3</button>
                        <button class="tool-btn" onclick="formatText('H4')">H4</button>
                        <button class="tool-btn" onclick="formatText('P')">正文</button>
                    </div>
                    <div class="toolbar-group">
                        <button class="tool-btn" onclick="execCmd('bold')" title="加粗"><b>B</b></button>
                        <button class="tool-btn" onclick="execCmd('italic')" title="斜体"><i>I</i></button>
                        <button class="tool-btn" onclick="execCmd('underline')" title="下划线"><u>U</u></button>
                        <button class="tool-btn" onclick="formatBlock('blockquote')" title="引言区块">💬 引言</button>
                        <button class="tool-btn" onclick="execCmd('insertUnorderedList')" title="无序列表">• 列表</button>
                        <button class="tool-btn" onclick="execCmd('insertOrderedList')" title="有序列表">1. 列表</button>
                    </div>
                    <button class="sticker-toggle-btn" onclick="toggleStickerPanel()">🎨 手帐贴纸箱</button>
                </div>

                <!-- 贴纸抽屉面板 -->
                <div class="sticker-panel" id="stickerPanel">
                    <span class="sticker-item" draggable="true" ondragstart="dragSticker(event, '🌸')">🌸</span>
                    <span class="sticker-item" draggable="true" ondragstart="dragSticker(event, '⭐')">⭐</span>
                    <span class="sticker-item" draggable="true" ondragstart="dragSticker(event, '💡')">💡</span>
                    <span class="sticker-item" draggable="true" ondragstart="dragSticker(event, '🧸')">🧸</span>
                    <span class="sticker-item" draggable="true" ondragstart="dragSticker(event, '☕')">☕</span>
                    <span class="sticker-item" draggable="true" ondragstart="dragSticker(event, '📌')">📌</span>
                    <span class="sticker-item" draggable="true" ondragstart="dragSticker(event, '🍀')">🍀</span>
                    <span class="sticker-item" draggable="true" ondragstart="dragSticker(event, '🍓')">🍓</span>
                    
                    <div id="customStickersContainer" style="display:inline-flex; gap:8px; align-items:center;"></div>

                    <label class="custom-sticker-upload">
                        + 自定义导入图片
                        <input type="file" accept="image/*" style="display: none;" onchange="importCustomSticker(event)">
                    </label>
                </div>

                <input type="text" class="notes-editor-title" id="noteTitleInput" placeholder="输入页面大标题..." autocomplete="off" oninput="autoSaveState()">

                <!-- 核心正文编辑区 -->
                <div class="notes-editor-body" id="noteBodyInput" contenteditable="true" placeholder="在这里沉浸式地书写文章内容..." onkeydown="handleNoteKeyDown(event)" oninput="updateStats()"></div>

                <!-- 底部字数/行数实时统计状态栏 -->
                <div class="notes-status-bar">
                    <span id="wordCountText">字数: 0 字</span>
                    <span id="lineCountText">行数: 0 行</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 空格键大图预览模态框 -->
    <div class="image-preview-modal" id="imagePreviewModal" onclick="closeImagePreview()">
        <img id="previewModalImg" src="" alt="大图预览">
    </div>

    <!-- 优雅的轻提示 Toast -->
    <div class="toast-tip" id="toastTip">✨ 数据已自动保存并同步！</div>

    <!-- GitHub 授权与仓库选择弹窗 -->
    <div class="modal-overlay" id="githubAuthModal">
        <div class="modal">
            <h3>☁️ 绑定您的 GitHub 私有仓库</h3>
            <p style="font-size: 13px; color: #8c7368; line-height: 1.4;">输入您的 Personal Access Token (需 repo 权限)，系统将自动加载您的私有/公开仓库供您选择。</p>
            <input type="password" id="ghTokenInput" placeholder="粘贴您的 Token (ghp_...)" autocomplete="off">
            <button class="modal-btn confirm" style="width: 100%;" onclick="fetchUserRepositories()">加载我的仓库列表</button>
            
            <div id="repoSelectBox" style="display:none; flex-direction:column; gap:8px;">
                <div class="category-selector-label">选择用于保存数据的专属仓库：</div>
                <select id="userRepoSelect"></select>
                <button class="modal-btn confirm" style="width: 100%;" onclick="confirmRepoBinding()">确认绑定并开始同步</button>
            </div>
            <div class="modal-buttons" style="margin-top: 5px;">
                <button class="modal-btn cancel" onclick="closeGithubAuthModal()">取消</button>
            </div>
        </div>
    </div>

    <!-- 添加书签弹窗 -->
    <div class="modal-overlay" id="bookmarkModal">
        <div class="modal">
            <h3>✨ 添加新书签</h3>
            <input type="text" id="bookmarkTitle" placeholder="网站名称（例如：GitHub）">
            <input type="text" id="bookmarkUrl" placeholder="网址链接（例如：https://github.com）">
            <div class="category-selector-label">选择归属卡片分类：</div>
            <div class="category-tags" id="categoryTagsContainer"></div>
            <input type="text" id="bookmarkGroup" placeholder="或直接手打输入新分类名称..." autocomplete="off">
            <div class="modal-buttons">
                <button class="modal-btn cancel" onclick="closeModal()">取消</button>
                <button class="modal-btn confirm" onclick="saveBookmark()">确定添加</button>
            </div>
        </div>
    </div>

    <!-- 新建空白卡片分类弹窗 -->
    <div class="modal-overlay" id="cardModal">
        <div class="modal">
            <h3>📁 新建空白卡片分类</h3>
            <input type="text" id="newCardGroupName" placeholder="输入新卡片分类名称（例如：宝藏网站）" autocomplete="off">
            <div class="modal-buttons">
                <button class="modal-btn cancel" onclick="closeModal()">取消</button>
                <button class="modal-btn confirm" onclick="saveNewCardGroup()">创建卡片</button>
            </div>
        </div>
    </div>

    <!-- 新建笔记页面子文件夹弹窗 -->
    <div class="modal-overlay" id="noteSubModal">
        <div class="modal">
            <h3>📖 创建新笔记页面</h3>
            <input type="text" id="newNoteTitleInput" placeholder="输入页面名称（例如：读书笔记、灵感收集）" autocomplete="off">
            <div class="modal-buttons">
                <button class="modal-btn cancel" onclick="closeModal()">取消</button>
                <button class="modal-btn confirm" onclick="confirmCreateNote()">创建页面</button>
            </div>
        </div>
    </div>

    <script>
        let categories = JSON.parse(localStorage.getItem('markflow_categories')) || ["待办", "导航精品", "投资", "系统"];
        let bookmarks = JSON.parse(localStorage.getItem('markflow_bookmarks')) || [
            { id: 1, group: "待办", title: "Android 移动应用开发者工具", url: "https://developer.android.com" },
            { id: 2, group: "待办", title: "Typora - simple yet powerful...", url: "https://typora.io" },
            { id: 3, group: "导航精品", title: "Tbox导航 | 只收录优质在线工具...", url: "https://www.tboxn.com" },
            { id: 4, group: "投资", title: "VeighNa量化社区 - 你的开源...", url: "https://vnpy.com" },
            { id: 5, group: "系统", title: "GitHub", url: "https://github.com" }
        ];

        let notesList = JSON.parse(localStorage.getItem('markflow_notesList')) || [
            { id: 1, title: "🌸 我的手帐日常", content: "<p></p>" },
            { id: 2, title: "💡 灵感备忘录", content: "<p></p>" }
        ];
        
        let activeNoteId = parseInt(localStorage.getItem('markflow_activeNoteId')) || 1;
        let currentView = localStorage.getItem('markflow_currentView') || 'bookmarks';

        function generateBookmarksHtmlString() {
            let htmlContent = `<!DOCTYPE NETSCAPE-Bookmark-file-1>\n<META HTTP-EQUIV="Content-Type" CONTENT="text/html; charset=UTF-8">\n<TITLE>MarkFlow Bookmarks Backup</TITLE>\n<H1>Bookmarks</H1>\n<DL><p>\n`;

            cats.forEach(cat => {
                htmlContent += `    <DT><H3>${cat}</H3>\n    <DL><p>\n`;
                const items = bookmarks.filter(b => b.group === cat);
                items.forEach(item => {
                    htmlContent += `        <DT><A HREF="${item.url}">${item.title}</A></DT>\n`;
                });
                htmlContent += `    </DL><p>\n`;
            });
            htmlContent += `</DL><p>`;
            return htmlContent;

            const a = document.createElement('a');
            a.href = url;
            a.download = `markflow-bookmarks-${new Date().toISOString().slice(0,10)}.html`;
            document.body.appendChild(a);

        function handleImportBookmarks(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const parser = new DOMParser();
                const doc = parser.parseFromString(e.target.result, 'text/html');
                const links = doc.querySelectorAll('a');
                
                if (links.length === 0) {
                    alert('未能在文件中解析出有效的书签链接。');
                    return;
                }

                let importedCount = 0;
                links.forEach(a => {
                    const title = a.textContent.trim() || '未命名网页';
                    const url = a.getAttribute('href');
                    if (!url) return;

                    let groupName = '导入书签';
                    let parent = a.parentElement;
                    while (parent && parent.tagName !== 'BODY') {
                        if (parent.tagName === 'DL') {
                            const prev = parent.previousElementSibling;
                            if (prev && (prev.tagName === 'H3' || prev.tagName === 'DT')) {
                                groupName = prev.textContent.trim() || '导入书签';
                                break;
                            }
                        }
                        parent = parent.parentElement;
                    }

                    if (!categories.includes(groupName)) {
                        categories.push(groupName);
                    }

                    const newId = bookmarks.length > 0 ? Math.max(...bookmarks.map(b => b.id)) + 1 : 1;
                    bookmarks.push({ id: newId, group: groupName, title, url });
                    importedCount++;
                });

                event.target.value = '';
                persistState();
                renderBookmarks(bookmarks);
                alert(`✨ 成功导入 ${importedCount} 个书签！`);
            };
            reader.readAsText(file);
        }

        async function fetchUserRepositories() {
            const token = document.getElementById('ghTokenInput').value.trim();
            if (!token) { alert('请输入 Token'); return; }

            try {
                const res = await fetch('https://api.github.com/user/repos?visibility=all&sort=updated&per_page=100', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!res.ok) { alert('Token 验证失败，请确认是否具备 repo 权限'); return; }

                const repos = await res.json();
                const select = document.getElementById('userRepoSelect');
                select.innerHTML = '';
                repos.forEach(r => {
                    const opt = document.createElement('option');
                    opt.value = r.full_name;
                    opt.textContent = `${r.full_name} (${r.private ? '私有' : '公开'})`;
                    select.appendChild(opt);
                });

                verifiedTokenTemp = token;
                document.getElementById('repoSelectBox').style.display = 'flex';
                alert('✨ 验证成功！请在下方选择目标仓库');
            } catch(e) {
                alert('网络异常或请求失败');
            }
        }

        function confirmRepoBinding() {

            if(!repoFullName) { alert('请选择仓库'); return; }

            localStorage.setItem('gh_token', verifiedTokenTemp);
            localStorage.setItem('gh_target_repo', repoFullName);
            closeGithubAuthModal();
            alert('🎉 绑定成功！您的所有数据和书签 HTML 网页将自动同步到仓库: ' + repoFullName);
            syncDataToCloudRepo();
        }

        async function fetchDataFromCloudRepo() {
            const token = localStorage.getItem('gh_token');
            const repo = localStorage.getItem('gh_target_repo');
            if (!token || !repo) return;

            const path = 'markflow-backup-data.json';
            const url = `https://api.github.com/repos/${repo}/contents/${path}`;

            try {
                const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
                if (res.ok) {
                    const fileData = await res.json();
                    const jsonString = decodeURIComponent(escape(atob(fileData.content)));
                    const bundle = JSON.parse(jsonString);

                    if (bundle.categories) categories = bundle.categories;
                    if (bundle.bookmarks) bookmarks = bundle.bookmarks;
                    if (bundle.notesList) notesList = bundle.notesList;
                    if (bundle.cardPositions) cardPositions = bundle.cardPositions;
                    if (bundle.customStickers) customStickers = bundle.customStickers;

                    persistState();
                    renderBookmarks(bookmarks);
                    renderCustomStickers();
                    updateSidebar();
                }
            } catch (err) {
                console.error("云端刷新自动同步失败：", err);
            }
        }

        async function syncDataToCloudRepo() {
            const token = localStorage.getItem('gh_token');
            const repo = localStorage.getItem('gh_target_repo');
            if (!token || !repo) return;

            const jsonPath = 'markflow-backup-data.json';
            const jsonUrl = `https://api.github.com/repos/${repo}/contents/${jsonPath}`;

            const bundleData = {
                categories, bookmarks, notesList, cardPositions, customStickers,
                updatedAt: new Date().toISOString()
            };
            const jsonEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(bundleData, null, 2))));

            const htmlPath = 'bookmarks-backup.html';
            const htmlUrl = `https://api.github.com/repos/${repo}/contents/${htmlPath}`;
            const htmlString = generateBookmarksHtmlString();
            const htmlEncoded = btoa(unescape(encodeURIComponent(htmlString)));

            try {
                let jsonSha = '';
                const getJsonRes = await fetch(jsonUrl, { headers: { 'Authorization': `Bearer ${token}` } });
                if (getJsonRes.ok) {
                    const info = await getJsonRes.json();
                    jsonSha = info.sha;
                }
                await fetch(jsonUrl, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: '✨ MarkFlow 自动化云端同步 JSON 数据',
                        content: jsonEncoded,
                        sha: jsonSha || undefined
                    })
                });

                let htmlSha = '';
                const getHtmlRes = await fetch(htmlUrl, { headers: { 'Authorization': `Bearer ${token}` } });
                if (getHtmlRes.ok) {
                    const info = await getHtmlRes.json();
                    htmlSha = info.sha;
                }
                await fetch(htmlUrl, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: '✨ MarkFlow 自动同步生成书签防丢 HTML',
                        content: htmlEncoded,
                        sha: htmlSha || undefined
                    })
                });

                showToast();
            } catch(err) {
                console.error("云端同步失败：", err);
            }
        }

        function handleDropSticker(e) {
            e.preventDefault();
            const pageRect = document.getElementById('notesPageBody').getBoundingClientRect();
            const x = e.clientX - pageRect.left;
            const y = e.clientY - pageRect.top;

            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                for (let i = 0; i < e.dataTransfer.files.length; i++) {
                    const file = e.dataTransfer.files[i];
                    if (file.type.startsWith('image/')) {
                        const reader = new FileReader();
                        reader.onload = function(event) {
                            createPlacedSticker(event.target.result, 'image', x + (i * 20), y + (i * 20));
                        };
                        reader.readAsDataURL(file);
                    }
                }
                return;
            }

            const textData = e.dataTransfer.getData('text/plain');
            const imgData = e.dataTransfer.getData('image/plain');

            if (textData) {
                createPlacedSticker(textData, 'text', x, y);
            } else if (imgData) {
                createPlacedSticker(imgData, 'image', x, y);
            }
        }

        function createPlacedSticker(content, type, x, y, rotateDeg, customWidth) {
            const span = document.createElement('span');
            span.className = 'note-sticker-placed';
            span.style.left = x + 'px';
            span.style.top = y + 'px';
            if (rotateDeg) {
                span.style.transform = `rotate(${rotateDeg}deg)`;
            }

            if (type === 'text') {
                span.innerHTML = `<span>${content}</span>`;
                makeElementInteractive(span);
                document.getElementById('notesPageBody').appendChild(span);
                selectSticker(span);
            } else {
                const imgObj = new Image();
                imgObj.src = content;
                imgObj.onload = function() {
                    let w = customWidth || imgObj.naturalWidth;
                    let h = customWidth ? Math.round(customWidth * (imgObj.naturalHeight / imgObj.naturalWidth)) : imgObj.naturalHeight;
                    const maxBase = 220;
                    if (!customWidth) {
                        if (w > h) {
                            h = Math.round(h * (maxBase / w));
                            w = maxBase;
                        } else {
                            w = Math.round(w * (maxBase / h));
                            h = maxBase;
                        }
                    }

                    span.innerHTML = `
                        <img src="${content}" alt="sticker" style="width:${w}px; height:${h}px;">
                        <div class="sticker-rotate-handle" onmousedown="initRotate(event, this)"></div>
                        <div class="sticker-resize-handle" onmousedown="initResize(event, this)"></div>
                    `;
                    makeElementInteractive(span);
                    document.getElementById('notesPageBody').appendChild(span);
                    selectSticker(span);
                };
            }
        }

        function initResize(e, handle) {
            e.stopPropagation();
            const sticker = handle.parentElement;
            selectSticker(sticker);
            const img = sticker.querySelector('img');
            const startX = e.clientX;
            const startWidth = img.offsetWidth;

            function onMouseMove(moveEvent) {
                const currentX = moveEvent.clientX;
                const newWidth = Math.max(60, startWidth + (currentX - startX));
                const ratio = img.naturalHeight / img.naturalWidth;
                img.style.width = newWidth + 'px';
                img.style.height = Math.round(newWidth * ratio) + 'px';
            }

            function onMouseUp() {
                window.removeEventListener('mousemove', onMouseMove);
                window.removeEventListener('mouseup', onMouseUp);
                autoSaveState();
            }

            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);
        }

        function initRotate(e, handle) {
            e.stopPropagation();
            const sticker = handle.parentElement;
            selectSticker(sticker);
            const rect = sticker.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            function onMouseMove(moveEvent) {
                const radians = Math.atan2(moveEvent.clientY - centerY, moveEvent.clientX - centerX);
                let degree = (radians * (180 / Math.PI)) + 90;
                sticker.style.transform = `rotate(${Math.round(degree)}deg)`;
            }

            function onMouseUp() {
                window.removeEventListener('mousemove', onMouseMove);
                window.removeEventListener('mouseup', onMouseUp);
                autoSaveState();
            }

            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);
        }

        function makeElementInteractive(elm) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            let longPressTimer = null;
            let isDragging = false;

            elm.onmousedown = function(e) {
                if (e.target.classList.contains('sticker-resize-handle') || e.target.classList.contains('sticker-rotate-handle')) return;
                e.preventDefault();
                selectSticker(elm);
                isDragging = false;
                pos3 = e.clientX;
                pos4 = e.clientY;

                longPressTimer = setTimeout(() => {
                    if (!isDragging) {
                        if (confirm('✨ 要撕掉这个小贴纸吗？')) {
                            elm.remove();
                            if (selectedStickerElement === elm) selectedStickerElement = null;
                            autoSaveState();
                        }
                    }
                }, 600);

                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            };

            function elementDrag(e) {
                e.preventDefault();
                const moveDist = Math.abs(e.clientX - pos3) + Math.abs(e.clientY - pos4);
                if (moveDist > 4) {
                    isDragging = true;
                    if (longPressTimer) clearTimeout(longPressTimer);
                }

                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                elm.style.top = (elm.offsetTop - pos2) + "px";
                elm.style.left = (elm.offsetLeft - pos1) + "px";
            }

            function closeDragElement() {
                if (longPressTimer) clearTimeout(longPressTimer);
                document.onmouseup = null;
                document.onmousemove = null;
                autoSaveState();
            }
        }

            let html = `

                <div class="bookmark-sub-container ${bookmarkMenuCollapsed ? 'collapsed' : ''}">
            `;

            cats.forEach(cat => {
                const isCatActive = (currentView === 'bookmarks' && currentCategory === cat);
                html += `
                    <div class="sub-menu-item ${isCatActive ? 'active' : ''}" onclick="switchView('bookmarks', '${cat}', event)">
                        <div class="sub-menu-left">📁 <span class="menu-text">${cat}</span></div>
                        <button class="sub-delete-btn" onclick="deleteCategory('${cat}', event)" title="删除分类">×</button>
                    </div>
                `;
            });

            html += `</div>`;

            const isNotesActive = (currentView === 'notes');
            html += `
                <div class="menu-item ${isNotesActive ? 'active' : ''} ${notesMenuCollapsed ? 'collapsed-cat' : ''}" onclick="switchView('notes', ${notesList.length > 0 ? notesList[0].id : null}, event)">
                    <span>📖 <span class="menu-text">手帐笔记</span></span>
                    <span class="arrow" onclick="toggleNotesMenuState(event)">▾</span>
                </div>
                <div class="sub-menu-container ${notesMenuCollapsed ? 'collapsed' : ''}">
            `;

            notesList.forEach(note => {
                const isActive = (currentView === 'notes' && activeNoteId === note.id) ? 'active' : '';
                html += `
                    <div class="sub-menu-item ${isActive}" onclick="switchView('notes', ${note.id}, event)">
                        <div class="sub-menu-left">📄 <span class="menu-text">${note.title}</span></div>
                        <button class="sub-delete-btn" onclick="deleteNote(${note.id}, event)" title="删除页面">×</button>
                    </div>
                `;
            });

            html += `
                    <button class="add-note-sub-btn" onclick="openNewNoteModal()">+ 新建页面</button>
                </div>
            `;
            
            menuList.innerHTML = html;
        }

        function switchView(view, targetId, event) {
            if(event) event.stopPropagation();
            currentView = view;

            // 移动端切换视图后自动收起左侧抽屉菜单
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('mobile-open');
            }

            const bmContainer = document.getElementById('bookmarkContainer');
            const notesContainer = document.getElementById('notesContainer');
            const topHeader = document.getElementById('topHeader');
            const zoomBar = document.getElementById('zoomControlBar');

            if (view === 'bookmarks') {
                if(targetId !== null) currentCategory = targetId;
                document.getElementById('canvasScrollWrapper').style.display = 'block';
                notesContainer.style.display = 'none';
                topHeader.style.display = 'flex';
                zoomBar.style.display = 'flex';
                renderBookmarks(bookmarks);
            } else {
                document.getElementById('canvasScrollWrapper').style.display = 'none';
                notesContainer.style.display = 'flex';
                topHeader.style.display = 'none';
                zoomBar.style.display = 'none';
                
                if (targetId !== null) {
                    activeNoteId = targetId;
                } else if (notesList.length > 0) {
                    activeNoteId = notesList[0].id;
                }

                const currentNoteObj = notesList.find(n => n.id === activeNoteId);
                if (currentNoteObj) {
                    document.getElementById('noteTitleInput').value = currentNoteObj.title;
                    document.getElementById('noteBodyInput').innerHTML = currentNoteObj.content || '<p></p>';
                } else {
                    document.getElementById('noteTitleInput').value = '';
                    document.getElementById('noteBodyInput').innerHTML = '<p></p>';
                }
                updateStats();
            }
            persistState();
            updateSidebar();
        }

        function formatText(tag) {
            const editor = document.getElementById('noteBodyInput');
            editor.focus();
            if (tag === 'P') {
                document.execCommand('formatBlock', false, '<p>');
            } else {
                document.execCommand('formatBlock', false, `<${tag}>`);
            }
            autoSaveState();
        }

        function execCmd(command) {
            const editor = document.getElementById('noteBodyInput');
            editor.focus();
            document.execCommand(command, false, null);
            updateStats();
            autoSaveState();
        }

        function formatBlock(tag) {
            const editor = document.getElementById('noteBodyInput');
            editor.focus();
            document.execCommand('formatBlock', false, `<${tag}>`);
            updateStats();
            autoSaveState();
        }

        function handleNoteKeyDown(e) {
            if (e.key === 'Enter') {
                document.execCommand('insertParagraph', false, null);
                e.preventDefault();
            }
            updateStats();
            autoSaveState();
        }

        function updateStats() {
            const editor = document.getElementById('noteBodyInput');
            const text = editor.innerText || '';
            const charCount = text.replace(/[\n\r\s]/g, '').length;
            const lineCount = text.split(/\r\n|\r|\n/).length;
            
            document.getElementById('wordCountText').innerText = `字数: ${charCount} 字`;
            document.getElementById('lineCountText').innerText = `行数: ${lineCount} 行`;
        }

        function saveActiveNote() {
            autoSaveState();
            showToast();
        }

        function showToast() {
            const toast = document.getElementById('toastTip');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        function deleteNote(id, event) {
            event.stopPropagation();
            if (notesList.length <= 1) {
                alert('留一个页面吧~ 至少需要保留一个手帐页面。');
                return;
            }
            if (confirm('确定要删除这个手帐页面吗？')) {
                notesList = notesList.filter(n => n.id !== id);
                if (activeNoteId === id) {
                    activeNoteId = notesList[0].id;
                }
                persistState();
                switchView('notes', activeNoteId);
            }
        }

        function openNewNoteModal() {
            document.getElementById('noteSubModal').style.display = 'flex';
            document.getElementById('newNoteTitleInput').value = '';
            document.getElementById('newNoteTitleInput').focus();
        }

        function confirmCreateNote() {
            const title = document.getElementById('newNoteTitleInput').value.trim();
            if (!title) {
                alert('请输入页面名称哦~');
                return;
            }
            const newId = notesList.length > 0 ? Math.max(...notesList.map(n => n.id)) + 1 : 1;
            notesList.push({ id: newId, title: title, content: `<p></p>` });
            closeModal();
            persistState();
            switchView('notes', newId);
        }

        function renderBookmarks(data) {
            const container = document.getElementById('bookmarkContainer');
            container.innerHTML = '';

            const catsToRender = currentCategory === 'all' ? getAllCategories() : [currentCategory];
            
            catsToRender.forEach((groupName, index) => {
                const items = data.filter(b => b.group === groupName);
                
                if (!cardPositions[groupName]) {
                    cardPositions[groupName] = {
                        x: 100 + (index % 3) * 380 + (Math.random() * 30 - 15),
                        y: 100 + Math.floor(index / 3) * 380 + (Math.random() * 30 - 15),
                        rotate: (Math.random() * 4 - 2)
                    };
                }
                const pos = cardPositions[groupName];

                const cardDiv = document.createElement('div');
                cardDiv.className = 'card-group';
                cardDiv.style.left = pos.x + 'px';
                cardDiv.style.top = pos.y + 'px';
                cardDiv.style.transform = `rotate(${pos.rotate}deg)`;

                initDrag(cardDiv, groupName);

                let cardHtml = `
                    <div class="card-group-title">
                        <span>${groupName}</span>
                        <div class="card-group-right">
                            <span class="count-badge">${items.length}</span>
                            <button class="delete-card-btn" onclick="deleteCategory('${groupName}', event)" title="删除该卡片分类">×</button>
                        </div>
                    </div>
                `;
                
                if (items.length === 0) {
                    cardHtml += `<div class="empty-card-tip">暂无书签，快去添加吧~</div>`;
                } else {
                    items.forEach(item => {
                        cardHtml += `
                            <div class="bookmark-item">
                                <a href="${item.url}" class="bookmark-link" target="_blank">${item.title}</a>
                                <div class="actions">
                                    <button class="btn" onclick="deleteBookmark(${item.id})">删除</button>
                                </div>
                            </div>
                        `;
                    });
                }

                cardHtml += `
                    <div class="card-add-btn" onclick="openBookmarkModalForGroup('${groupName}')">
                        <span>+ 添加网页</span>
                    </div>
                `;
                
                cardDiv.innerHTML = cardHtml;
                container.appendChild(cardDiv);
            });

            updateSidebar();
        }

        function initDrag(cardElement, groupName) {
            let isDragging = false;
            let startX, startY;

            cardElement.addEventListener('mousedown', (e) => {
                if (e.target.tagName === 'A' || e.target.tagName === 'BUTTON' || e.target.closest('.bookmark-item') || e.target.closest('.card-add-btn')) {
                    return;
                }
                isDragging = true;
                startX = e.clientX - cardPositions[groupName].x;
                startY = e.clientY - cardPositions[groupName].y;
                cardElement.style.zIndex = 150;
                e.preventDefault();
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const newX = e.clientX - startX;
                const newY = e.clientY - startY;
                cardPositions[groupName].x = newX;
                cardPositions[groupName].y = newY;
                cardElement.style.left = newX + 'px';
                cardElement.style.top = newY + 'px';
            });

            window.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    cardElement.style.zIndex = 1;
                    persistState();
                }
            });
        }

        function deleteBookmark(id) {
            bookmarks = bookmarks.filter(b => b.id !== id);
            persistState();
            renderBookmarks(bookmarks);
        }

        function deleteCategory(groupName, event) {
            if(event) event.stopPropagation();
            if (confirm(`确定要删除“${groupName}”这个分类吗？里面的书签也会被移除哦~`)) {
                categories = categories.filter(c => c !== groupName);
                bookmarks = bookmarks.filter(b => b.group !== groupName);
                delete cardPositions[groupName];
                if (currentCategory === groupName) {
                    currentCategory = 'all';
                }
                persistState();
                renderBookmarks(bookmarks);
            }
        }

        function handleSearch() {
            openSearchFullscreen();
        }

        function openCardModal() {
            document.getElementById('cardModal').style.display = 'flex';
            document.getElementById('newCardGroupName').value = '';
            document.getElementById('newCardGroupName').focus();
        }

        function openBookmarkModal() {
            const targetCat = currentCategory !== 'all' ? currentCategory : (getAllCategories()[0] || '默认');
            openBookmarkModalForGroup(targetCat);
        }

        function openBookmarkModalForGroup(groupName) {
            document.getElementById('bookmarkModal').style.display = 'flex';
            renderCategoryTags(groupName);
            document.getElementById('bookmarkGroup').value = groupName;
            document.getElementById('bookmarkTitle').value = '';
            document.getElementById('bookmarkUrl').value = '';
            document.getElementById('bookmarkTitle').focus();
        }

        function closeModal() {
            document.getElementById('bookmarkModal').style.display = 'none';
            document.getElementById('cardModal').style.display = 'none';
            document.getElementById('noteSubModal').style.display = 'none';
        }

        function renderCategoryTags(defaultCat = '') {
            const container = document.getElementById('categoryTagsContainer');
            const cats = getAllCategories();
            let html = '';
            cats.forEach(cat => {
                const isSelected = (cat === defaultCat) ? 'selected' : '';
                html += `<div class="category-tag ${isSelected}" onclick="selectTag('${cat}', this)">📁 ${cat}</div>`;
            });
            container.innerHTML = html;
            selectedGroup = defaultCat;
        }

        function selectTag(cat, element) {
            document.querySelectorAll('.category-tag').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            selectedGroup = cat;
            document.getElementById('bookmarkGroup').value = cat;
        }

        function saveNewCardGroup() {
            const groupName = document.getElementById('newCardGroupName').value.trim();
            if (!groupName) {
                alert('请输入卡片分类名称哦~');
                return;
            }
            if (!categories.includes(groupName)) {
                categories.push(groupName);
                cardPositions[groupName] = {
                    x: 100 + Math.random() * 200,
                    y: 100 + Math.random() * 200,
                    rotate: (Math.random() * 4 - 2)
                };
            }
            closeModal();
            persistState();
            renderBookmarks(bookmarks);
        }

        function saveBookmark() {
            const title = document.getElementById('bookmarkTitle').value.trim();
            const url = document.getElementById('bookmarkUrl').value.trim();
            const typedGroup = document.getElementById('bookmarkGroup').value.trim();
            const group = typedGroup || selectedGroup || '未分类';

            if (!title || !url) {
                alert('请填写完整的网站名称和链接哦~');
                return;
            }

            if (!categories.includes(group) && !getAllCategories().includes(group)) {
                categories.push(group);
            }

            const newId = bookmarks.length > 0 ? Math.max(...bookmarks.map(b => b.id)) + 1 : 1;
            bookmarks.push({ id: newId, group, title, url });

            closeModal();
            persistState();
            renderBookmarks(bookmarks);
        }

        renderCustomStickers();
        switchView(currentView, currentCategory, null);
    </script>
</body>
</html>
